[General]
network = CombinedNetwork

sim-time-limit = 600s
**.arp.typename = "GlobalArp"

*.configurator.assignAddresses       = true
*.configurator.configureRoutingTable = true
*.configurator.dumpAddresses = true
*.configurator.dumpLinks     = true
*.configurator.dumpTopology  = true
*.configurator.dumpRoutes    = true
*.configurator.logLevel      = debug

*.server.numEthInterfaces     = 1
*.server.numApps              = 1
*.server.app[0].typename      = "inet.applications.udpapp.UdpEchoApp"
*.server.app[0].localPort     = 80
*.server.app[0].replyDelay    = 0s
*.server.app[0].recordScalar  = true
*.server.app[0].recordVector  = true

*.monitor.initialRate   = 15000
*.monitor.enabled                    = true
*.monitor.recordVector               = true
*.monitor.recordScalar               = true
*.monitor.snmpTrigger.record         = vector
*.monitor.sampleRate.record     = vector
*.monitor.outToFlowCollector.record  = vector

*.monitor.trainingPeriod        = 900s
*.monitor.samplePeriod          = 1s
*.monitor.floorFactor = 1.05

*.collector.enabled             = true
*.collector.maxFlows            = 10000
*.collector.recordVector        = true
*.collector.flowsExported.record= vector
*.collector.collectionWindow     = 1s

*.analyzer.enabled              = true
*.analyzer.topN                 = 5
*.analyzer.recordVector         = true
*.analyzer.attackFlow.record    = vector

*.attacker*.typename = "CustomBurstSender"
*.attacker*.sleepDuration = 10000s
*.attacker*.sendInterval = exponential(0.0016s)

*.goodClient.typename = "CustomBurstSender"
*.goodClient.startTime = 0s
*.goodClient.burstDuration = 600s
*.goodClient.sleepDuration = 0s
*.goodClient.sendInterval = uniform(0.0004s, 0.0016s)

[SIM-90s]
sim-time-limit             = 90s
*.monitor.samplePeriod     = 15s
*.monitor.trainingPeriod   = 0s
*.monitor.threshold        = 1.5
*.collector.collectionWindow = 15s

*.attacker*.startTime = 31s
*.attacker*.burstDuration = 59s
*.goodClient.burstDuration = 600s

[LADS-60s]
*.monitor.samplePeriod     = 60s
*.monitor.trainingPeriod   = 0s
*.monitor.threshold        = 1.5
*.collector.collectionWindow = 60s

*.attacker*.startTime = 450s
*.attacker*.burstDuration = 150s

[LADS-30s]
*.monitor.samplePeriod     = 30s
*.monitor.trainingPeriod   = 0s
*.monitor.threshold        = 1.5
*.collector.collectionWindow = 30s

*.attacker*.startTime = 450s
*.attacker*.burstDuration = 150s

[MULTIATTACKS-60s]
sim-time-limit             = 600s
*.monitor.samplePeriod     = 60s
*.monitor.trainingPeriod   = 0s
*.monitor.threshold        = 1.5
*.collector.collectionWindow = 60s

*.attacker1.startTime = 70s
*.attacker1.burstDuration = 40s

*.attacker2.startTime = 70s
*.attacker2.burstDuration = 40s

*.attacker3.startTime = 210s
*.attacker3.burstDuration = 80s

*.attacker4.startTime = 210s
*.attacker4.burstDuration = 80s

*.attacker5.startTime = 400s
*.attacker5.burstDuration = 60s

*.attacker6.startTime = 450s
*.attacker6.burstDuration = 60s

[MULTIATTACKS-30s]
sim-time-limit             = 600s

*.monitor.samplePeriod     = 30s
*.monitor.trainingPeriod   = 0s
*.monitor.threshold        = 1.5
*.collector.collectionWindow = 30s

*.attacker1.startTime = 70s
*.attacker1.burstDuration = 40s

*.attacker2.startTime = 70s
*.attacker2.burstDuration = 40s

*.attacker3.startTime = 210s
*.attacker3.burstDuration = 80s

*.attacker4.startTime = 210s
*.attacker4.burstDuration = 80s

